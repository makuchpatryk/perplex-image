name: E2E Tests

on:
  # Run on PR open/update to test before merge
  pull_request:
    branches:
      - main
      - master

  # Manual trigger with branch selection
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: false
        default: "main"

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'

    name: Playwright E2E – Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Zainstaluj zależności
        run: pnpm install --frozen-lockfile

      - name: Zainstaluj przeglądarki Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Zbuduj aplikację
        run: pnpm build
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Uruchom testy E2E
        run: pnpm test:e2e --project=chromium
        env:
          CI: true
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Wgraj raport Playwright (zawsze, nawet przy błędach)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Wgraj screenshoty z nieudanych testów
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7
